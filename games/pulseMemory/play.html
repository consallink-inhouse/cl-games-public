<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Pulse Memory</title>
	<link rel="stylesheet" href="./css/pulseMemory.css">
</head>

<body>
	<!-- 共通ヘッダー（参考ソース踏襲） -->
	<div class="game-thumb">
		<div class="thumb-left game-title">
			<a href="../game_center.html">
				<img src="../images/header/HeaderLogo.png" alt="CL-GAME CENTER" />
			</a>
		</div>
	</div>
	<div class="game-thumb">
		<div class="thumb-left">
			<a href="./menu.html">
				<img src="./images/Header_PulseMemory.png" alt="PulseMemory" onerror="this.style.display='none';" />
			</a>
		</div>
	</div>

	<div id="levelDisplay">LEVEL 1</div>

	<div id="gameContainer">
		<div class="game-description">
			<p class="description-title">ゲーム説明</p>
			<ul>
				① 光ったパネルの順番を記憶する<br/>
				② 光った順番どおりにパネルを押す<br/>
				③ 正解すると、記憶するパネルが1つ増える<br/>
				④ 順番を間違えると、ゲームオーバー<br/>
			</ul>
			<p class="closing-phrase">記憶力の限界のその先へ！</p>
		</div>
	</div>

	<div class="button-group">
		<button id="startBtn">START</button>
	</div>

	<div class="logo-footer">
		<a href="../game_center.html">
			<img src="../images/ConsalLink.png" alt="CL LOGO">
		</a>
	</div>

	<script src="./js/pulseMemory.js"></script>
</body>

</html>
